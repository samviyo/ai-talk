# Gates: thresholds on each scorer's mean. A red gate fails the run (exit 1).
# A scorer with no gate here is shown as info.
#
#   [score_name]
#   min = 0.8        # mean must be >= this
#   max = 0.1        # mean must be <= this (allowed instead of or with min)
#   min_n = 3        # optional: RED "insufficient evidence" below this many
#                    # applicable (non-None) trials; default is 1
#
# Gate your game scorers (evals/scorers/*.py) and your offline scorers
# (evals/scorers/offline/*.py) here. `seats_match`, the one shipped puzzle
# helper, is info until you gate it.
