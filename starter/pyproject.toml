[project]
name = "werewolf-starter"
version = "0.1.0"
description = "Team starter kit for the Werewolf agent workshop"
requires-python = ">=3.12"
dependencies = [
  "autoevals>=0.4.0",
  "braintrust>=0.46.1",
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "openai>=1.40",
]

[project.scripts]
bot = "bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
