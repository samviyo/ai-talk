[project]
name = "define-finished"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9",
  "httpx>=0.27",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "openai>=1.40",
]

[project.scripts]
ww = "werewolf.server.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["werewolf", "connect4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["werewolf", "connect4"]
